groups:
  - name: node-health
    rules:
      # ---- 真实阈值规则 ----
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
          service: node
        annotations:
          summary: "node-exporter 不可达（{{ $labels.instance }}）"
          description: "主机指标采集中断，Prometheus 无法抓取 {{ $labels.instance }}，该机的资源类告警会全部失效。"

      - alert: HostDiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[1h], 24*3600) < 0
        for: 5m
        labels:
          severity: warning
          service: node
        annotations:
          summary: "磁盘将在 24 小时内写满（{{ $labels.mountpoint }}）"
          description: "按最近 1 小时的增长速度推算，{{ $labels.instance }} 的 {{ $labels.mountpoint }} 将在 24h 内耗尽。"

      - alert: HostHighLoad
        expr: node_load5 > on(instance) (count by(instance)(node_cpu_seconds_total{mode="idle"}) * 2)
        for: 5m
        labels:
          severity: warning
          service: node
        annotations:
          summary: "系统 5 分钟负载超过 CPU 核数的 2 倍"
          description: "{{ $labels.instance }} 负载持续偏高，可能存在 CPU 密集任务或 IO 阻塞。"

  - name: pipeline
    rules:
      # Watchdog：始终 firing 的心跳告警。
      # 这是 Prometheus 官方推荐的告警链路自检手段（AlwaysFiring），
      # 用于确认「采集 → 规则评估 → Alertmanager」整条通路没有断。
      # 指标是真的（vector(1) 常量），不是伪造的告警。
      - alert: Watchdog
        expr: vector(1)
        for: 1m
        labels:
          severity: none
          service: monitoring
        annotations:
          summary: "告警链路心跳（常驻触发）"
          description: "该告警始终处于 firing 状态，用于验证告警通路可用；如果它消失，说明告警链路断了。"
