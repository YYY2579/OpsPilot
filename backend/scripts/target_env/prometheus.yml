global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # 宿主机指标（经 node-exporter）
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node
          env: test

  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          env: test

  # Alertmanager 自身
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: alertmanager
          env: test
