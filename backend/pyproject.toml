[project]
name = "ops-pilot-tools"
version = "0.1.0"
description = "OpsPilot 运维工具包 —— OpenHands ToolDefinition 实现（规格 §A5.2 / §A6.4）"
requires-python = ">=3.10"
dependencies = [
    "paramiko==3.5.1",
    "pymysql",           # 数据库只读工具（db/client.py 延迟导入，运行时才需要）
    "fastapi==0.141.1",
    # 不锁上限：openhands-sdk → fastmcp 3.2+ 要求 uvicorn>=0.35，锁死 0.34 会让
    # pip 依赖解析直接失败（真实踩过：ResolutionImpossible: fastmcp depends on uvicorn>=0.35）
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
# SDK 胶水层（get_server_health/definition.py）需要；纯逻辑层不需要。
# 版本必须与 openhands-sdk 严格对齐：README 约定 agent-server 实际运行版本。
#
# **openhands-tools 不可省**：SDK 1.47 起 `default_tool_specs()` 只返回声明
# （Tool(name=...)），不注册实现；terminal/file_editor/task_tracker 的实现已
# 独立成包。缺它会在 Conversation 初始化时抛
# `KeyError: ToolDefinition 'terminal' is not registered`（真实踩过）。
sdk = ["openhands-sdk==1.47.0", "openhands-tools==1.47.0"]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ops_pilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
